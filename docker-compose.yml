services:
  spark:
    image: jupyter/pyspark-notebook
    container_name: tradecorp_training_spark
    ports:
      - "8888:8888"
      - "4041:4040"
    volumes:
      - ./data:/home/jovyan/data
      - ./notebooks:/home/jovyan/work
    
    environment:
      - SPARK_OPTS=--packages org.postgresql:postgresql:42.7.0
      - PYSPARK_SUBMIT_ARGS=--packages org.postgresql:postgresql:42.7.0 pyspark-shell
  
  postgres:
    image: postgres:16
    container_name: tradecorp_training_postgres
    environment:
      POSTGRES_USER: tradecorp 
      POSTGRES_PASSWORD: tradecorp
      POSTGRES_DB: tradecorp
    ports:
      - "5454:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: